name: Uniqlo watch

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test alert to the phone"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Uniqlo
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: python3 uniqlo_check.py
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain uniqlo_state.json)" ]; then
            git config user.name "price-watch"
            git config user.email "price-watch@users.noreply.github.com"
            git add uniqlo_state.json
            git commit -m "Update Uniqlo watch state"
            git pull --rebase
            git push
          fi
