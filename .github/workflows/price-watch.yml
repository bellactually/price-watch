name: Price watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test alert to the phone"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: price-watch-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - name: Watch price and stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_ALERT: ${{ inputs.test_alert }}
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && '340' || '0' }}
        run: python3 check.py
