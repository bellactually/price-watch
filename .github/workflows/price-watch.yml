name: Price watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test alert to the phone"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check price
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: python3 check.py
      - name: Save last seen price
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "price-watch"
            git config user.email "price-watch@users.noreply.github.com"
            git add state.json
            git commit -m "Update last seen price"
            git push
          fi
